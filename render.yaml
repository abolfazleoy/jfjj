# Render Blueprint — https://render.com/docs/blueprint-spec
#
# کد همیشه از داخل ایمیج (/opt/jafj) اجرا می‌شود و دیسک فقط داده‌ها را
# نگه می‌دارد (/data). دیسک را هرگز روی /app یا /opt/jafj مانت نکن؛
# دیسکِ مانت‌شده روی مسیرِ کد، کدِ ایمیج را پنهان می‌کند و هر دیپلوی
# بی‌اثر می‌شود.
services:
  - type: web
    name: jafj
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh /opt/jafj/render-start.sh
    healthCheckPath: /healthz
    # هر پوش به main خودش دیپلوی شود — وگرنه بعد از مرج، هاست روی کدِ قبلی
    # می‌ماند و «چرا نرسید؟». نکته: تغییرِ این فایل به‌تنهایی سرویسِ <b>دستیِ</b>
    # موجود را عوض نمی‌کند؛ یا Blueprint را Sync کن یا در داشبورد
    # Settings → Auto-Deploy را روشن بگذار (و Manual Deploy را بزنی).
    branch: main
    autoDeploy: true
    region: frankfurt
    plan: starter
    envVars:
      - key: DATA_DIR
        value: /data
      - key: JAFJ_IMAGE_DIR
        value: /opt/jafj
      - key: JAFJ_APP_DIR
        value: /data
      - key: PORT
        value: 10000
      - key: JAFJ_MAX_CRASHES
        value: 5
      - key: BOT_TOKEN
        sync: false
      - key: BACKUP_CHAT
        sync: false
      # پشتیبان اطلاعات مشتری‌ها در گیت‌هاب (tools/gh_data_sync.py).
      # TOKEN را در داشبورد رندر بگذار (sync: false = رندر آن را با دیپلوی پاک نمی‌کند)
      - key: DATA_GITHUB_TOKEN
        sync: false
      - key: DATA_GITHUB_REPO
        value: djskkskw/jfjj-data
    disk:
      name: jafj-data
      mountPath: /data
      sizeGB: 1
